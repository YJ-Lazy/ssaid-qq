plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ssaidhookQQ'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.ssaidhookQQ"
        minSdk 27
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
