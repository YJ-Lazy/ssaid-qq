plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ssaidhookQQ'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ssaidhookQQ"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            merges += ['META-INF/xposed/*']
        }
    }
}

dependencies {
    // 仅编译期依赖，运行时由 LSPosed 注入
    compileOnly 'io.github.libxposed:api:102.0.0'
}
